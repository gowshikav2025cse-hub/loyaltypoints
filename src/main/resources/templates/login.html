
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LoyaltyPoints</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg,#dbeafe,#f3f6fc 55%,#e0e7ff); font-family: Arial,sans-serif; padding: 20px; }
        .container { width: 100%; max-width: 450px; background: white; padding: 42px; border-radius: 20px; box-shadow: 0 20px 60px #1e3a8a1a; }
        .brand { color: #1d4ed8; font-size: 29px; font-weight: 800; margin-bottom: 35px; }
        .brand span { color: #172554; }
        h1 { font-size: 29px; color: #172554; margin-bottom: 10px; }
        .subtitle { color: #64748b; line-height: 1.7; margin-bottom: 25px; }
        label { display: block; margin: 18px 0 9px; color: #334155; font-weight: 700; font-size: 14px; }
        input { width: 100%; padding: 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 15px; outline: none; }
        input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px #dbeafe; }
        button { width: 100%; margin-top: 25px; padding: 15px; background: #2563eb; color: white; border: 0; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .message { padding: 13px; margin-bottom: 15px; border-radius: 9px; font-size: 14px; line-height: 1.5; }
        .error { background: #fee2e2; color: #991b1b; }
        .success { background: #dcfce7; color: #166534; }
        .footer { text-align: center; margin-top: 25px; color: #64748b; line-height: 1.7; font-size: 14px; }
        a { color: #2563eb; text-decoration: none; font-weight: 700; }
        @media(max-width:480px) { .container { padding: 28px 23px; } }
    </style>
</head>
<body>
<div class="container">
    <div class="brand">Loyalty<span>Points</span></div>
    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to manage your loyalty points, purchases, and rewards.</p>

    <div class="message error" th:if="${param.error}">Invalid email or password.</div>
    <div class="message success" th:if="${success}" th:text="${success}"></div>
    <div class="message success" th:if="${param.logout}">You have successfully logged out.</div>

    <form th:action="@{/login}" method="post">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>

        <button type="submit">Sign In</button>
    </form>

    <div class="footer">
        Don't have an account?
        <a th:href="@{/signup}">Create Account</a>
    </div>
</div>
</body>
</html>
