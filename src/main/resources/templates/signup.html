<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | LoyaltyPoints</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f5fb;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 460px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .brand {
            color: #1e40af;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 28px;
        }

        h1 {
            font-size: 28px;
            color: #172554;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            color: #334155;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #64748b;
        }

        a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>
<div class="container">

    <div class="brand">LoyaltyPoints</div>

    <h1>Create Account</h1>
    <p class="subtitle">
        Join LoyaltyPoints and start earning rewards on your purchases.
    </p>

    <div class="message" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/signup}" method="post">

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name"
               placeholder="Enter your full name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="Create a password" minlength="8" required>

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword"
               name="confirmPassword"
               placeholder="Re-enter your password"
               minlength="8" required>

        <button type="submit">Create Account</button>
    </form>

    <div class="footer">
        Already have an account?
        <a th:href="@{/login}">Sign In</a>
    </div>

</div>
</body>
</html>
