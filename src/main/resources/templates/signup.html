
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | LoyaltyPoints</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg,#dbeafe,#f3f6fc 55%,#e0e7ff); font-family: Arial,sans-serif; padding: 20px; }
        .container { width: 100%; max-width: 470px; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 20px 60px #1e3a8a1a; }
        .brand { color: #1d4ed8; font-size: 29px; font-weight: 800; margin-bottom: 30px; }
        .brand span { color: #172554; }
        h1 { font-size: 29px; color: #172554; margin-bottom: 10px; }
        .subtitle { color: #64748b; line-height: 1.7; margin-bottom: 22px; }
        label { display: block; margin: 16px 0 8px; color: #334155; font-weight: 700; font-size: 14px; }
        input { width: 100%; padding: 13px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 15px; outline: none; }
        input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px #dbeafe; }
        button { width: 100%; margin-top: 24px; padding: 15px; background: #2563eb; color: white; border: 0; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .message { background: #fee2e2; color: #991b1b; padding: 13px; border-radius: 9px; margin-bottom: 15px; font-size: 14px; line-height: 1.5; }
        .footer { text-align: center; margin-top: 24px; color: #64748b; line-height: 1.7; font-size: 14px; }
        a { color: #2563eb; text-decoration: none; font-weight: 700; }
        @media(max-width:480px) { .container { padding: 28px 23px; } }
    </style>
</head>
<body>
<div class="container">
    <div class="brand">Loyalty<span>Points</span></div>
    <h1>Create Account</h1>
    <p class="subtitle">Join LoyaltyPoints and start earning rewards on your purchases.</p>

    <div class="message" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/signup}" method="post">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" autocomplete="name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Create a password" minlength="8" autocomplete="new-password" required>

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" minlength="8" autocomplete="new-password" required>

        <button type="submit">Create Account</button>
    </form>

    <div class="footer">
        Already have an account?
        <a th:href="@{/login}">Sign In</a>
    </div>
</div>
</body>
</html>
